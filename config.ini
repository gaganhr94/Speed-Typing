# Speed Typing Configuration
# This file contains configuration settings for the Speed Typing application

[PATHS]
# Relative paths from src directory
ASSETS_DIR = ../assets/
DATA_DIR = ../data/
DATABASE_DIR = ../database/
DOCS_DIR = ../docs/

[FILES]
# Asset files
SPLASH_IMAGE = Splash.png
APP_ICON = TypingLOGO.ico

# Data files
WORD_LIST = WordList.txt
TEXT_LINES = Text_Lines.txt

# Database files
USER_DATABASE = userhistory.db

[SETTINGS]
# Application settings
SPLASH_DURATION = 3000
DEFAULT_TEST_TIME = 60
DEFAULT_TRAINER_TIME = 60
MIN_ACCURACY_FOR_GROSS_WPM = 30

# Window dimensions
MAIN_WINDOW_SIZE = 600x455
TRAINER_WINDOW_SIZE = 1100x650
TEST_WINDOW_SIZE = 1300x590

[DATABASE]
# Database table structure
TABLE_NAME = users
FIELDS = name, username

[UI]
# Color scheme
PRIMARY_COLOR = #191970
SECONDARY_COLOR = #00FFFF
SUCCESS_COLOR = green
ERROR_COLOR = red
BACKGROUND_COLOR = lightblue